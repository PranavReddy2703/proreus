name: Build Agent

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    name: Build Go Agent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: proreus-agent-linux-amd64
          - os: linux
            arch: arm64
            name: proreus-agent-linux-arm64
          - os: darwin
            arch: arm64
            name: proreus-agent-darwin-arm64
          - os: windows
            arch: amd64
            name: proreus-agent-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Build Agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -o ../${{ matrix.name }} -trimpath -ldflags="-s -w" ./cmd/server/main.go

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}
