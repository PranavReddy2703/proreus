name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install App Dependencies
        working-directory: app
        run: npm ci

      - name: Generate Native Android Project (Prebuild)
        working-directory: app
        run: npx expo prebuild --platform android

      - name: Enable Split APKs (Reduce size <30MB)
        working-directory: app/android/app
        run: |
          sed -i 's/def enableSeparateBuildPerCPUArchitecture = false/def enableSeparateBuildPerCPUArchitecture = true/g' build.gradle

      - name: Build Release APKs
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/android/app/build/outputs/apk/release/app-x86_64-release.apk
